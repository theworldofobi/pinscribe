# Tiny Tapeout project information
project:
  title:        "pinscribe"      # Project title
  author:       "Obi Obetta"      # Your name
  discord:      "joyful_fawn_17589"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "programmable protocol emulator"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_theworldofobi_pinscribe"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "unused_ui0"
  ui[1]: "unused_ui1"
  ui[2]: "unused_ui2"
  ui[3]: "unused_ui3"
  ui[4]: "unused_ui4"
  ui[5]: "unused_ui5"
  ui[6]: "unused_ui6"
  ui[7]: "unused_ui7"

  # Outputs
  uo[0]: "unused_uo0"
  uo[1]: "unused_uo1"
  uo[2]: "unused_uo2"
  uo[3]: "unused_uo3"
  uo[4]: "unused_uo4"
  uo[5]: "unused_uo5"
  uo[6]: "unused_uo6"
  uo[7]: "unused_uo7"

  # Bidirectional pins
  uio[0]: "unused_uio0"
  uio[1]: "unused_uio1"
  uio[2]: "unused_uio2"
  uio[3]: "unused_uio3"
  uio[4]: "unused_uio4"
  uio[5]: "unused_uio5"
  uio[6]: "unused_uio6"
  uio[7]: "unused_uio7"

# Do not change!
yaml_version: 6
